<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Should you prepay your mortgage or invest? Compare both strategies with your own numbers."
    />
    <title>Mortgage vs. Investment</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- All visible texts are filled in by src/main.ts in the chosen language (src/i18n.ts). -->
    <div class="layout">
      <aside class="sidebar">
        <h1 id="title"></h1>
        <p class="lede" id="lede"></p>
        <div class="currency-row">
          <div class="segmented" id="currency" role="radiogroup"></div>
          <span class="help-slot" data-help-key="currency"></span>
        </div>
        <div class="controls" id="controls"></div>
        <div class="sidebar-footer">
          <div class="segmented languages" id="language" role="radiogroup"></div>
          <div class="credits" id="credits"></div>
        </div>
      </aside>

      <main>
        <div class="warning" id="warning" hidden></div>

        <section class="cards" id="cards"></section>

        <div class="verdict">
          <p id="verdict"></p>
          <span class="help-slot" data-help-key="verdict"></span>
        </div>

        <section class="panel chart-wrap">
          <span class="help-slot corner" data-help-key="chart"></span>
          <canvas id="chart"></canvas>
        </section>

        <section class="panel table-panel">
          <div class="table-header">
            <h2><span id="table-title"></span><span class="help-slot" data-help-key="table"></span></h2>
            <div class="segmented" id="table-case" role="radiogroup"></div>
          </div>
          <div class="table-wrap">
            <table id="table">
              <thead>
                <tr id="table-head"></tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>

        <footer class="footer">
          <p id="disclaimer"></p>
          <p id="privacy"></p>
        </footer>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
